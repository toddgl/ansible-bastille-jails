---
- name: Install Nextcloud, Nginx, and PHP dependencies
  community.general.pkgng:
    name:
      - nginx
      - nextcloud-php84
      - php84-pgsql
      - php84-pdo_pgsql
      - php84-gd
      - php84-curl
      - php84-zip
      - php84-zlib
      - php84-mbstring
      - php84-xml
      - php84-intl
      - php84-bcmath
      - php84-gmp
      - php84-fileinfo
      - php84-opcache
      - php84-pecl-imagick
      - py312-cryptography
    state: present

- name: Create Nginx conf.d directory
  ansible.builtin.file:
    path: /usr/local/etc/nginx/conf.d
    state: directory
    mode: '0755'

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: /usr/local/etc/ssl/nextcloud
    state: directory
    mode: '0700'

- name: Generate SSL Private Key
  community.crypto.openssl_privatekey:
    path: /usr/local/etc/ssl/nextcloud/nextcloud.key
    size: 2048
    type: RSA

- name: Generate OpenSSL Certificate Signing Request (CSR)
  community.crypto.openssl_csr:
    path: /usr/local/etc/ssl/nextcloud/nextcloud.csr
    privatekey_path: /usr/local/etc/ssl/nextcloud/nextcloud.key
    common_name: "{{ inventory_hostname }}"

- name: Generate Self-Signed Certificate
  community.crypto.x509_certificate:
    path: /usr/local/etc/ssl/nextcloud/nextcloud.crt
    privatekey_path: /usr/local/etc/ssl/nextcloud/nextcloud.key
    csr_path: /usr/local/etc/ssl/nextcloud/nextcloud.csr
    provider: selfsigned
    selfsigned_not_after: "+365d"

- name: Deploy main php-fpm.conf
  ansible.builtin.template:
    src: php-fpm.conf.j2
    dest: /usr/local/etc/php-fpm.conf
    mode: '0644'
  notify: Restart php-fpm

- name: Deploy php-fpm pool www.conf
  ansible.builtin.template:
    src: www.conf.j2
    dest: /usr/local/etc/php-fpm.d/www.conf
    mode: '0644'
  notify: Restart php-fpm

- name: Deploy main Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /usr/local/etc/nginx/nginx.conf
    mode: '0644'
  notify: Restart nginx

- name: Deploy Nextcloud Nginx vhost configuration
  ansible.builtin.template:
    src: nextcloud.conf.j2
    dest: /usr/local/etc/nginx/conf.d/nextcloud.conf
    mode: '0644'
  notify: Restart nginx


- name: Enable Nginx and PHP-FPM in rc.conf
  community.general.sysrc:
    name: "{{ item }}"
    value: "YES"
  loop:
    - nginx_enable
    - php_fpm_enable

- name: Ensure PHP-FPM and Nginx are started
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
  loop:
    - php_fpm
    - nginx

- name: Run Nextcloud automated installer via occ
  ansible.builtin.command:
    cmd: >
      php /usr/local/www/nextcloud/occ maintenance:install
      --database=pgsql
      --database-host={{ nextcloud_db_host | quote }}
      --database-name={{ nextcloud_db_name | quote }}
      --database-user={{ nextcloud_db_user | quote }}
      --database-pass={{ nextcloud_db_pass | quote }}
      --admin-user={{ nextcloud_admin_user | quote }}
      --admin-pass={{ nextcloud_admin_pass | quote }}
  become: true
  become_user: www
  args:
    creates: /usr/local/www/nextcloud/config/config.php
