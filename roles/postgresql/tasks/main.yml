---
- name: Install PostgreSQL 18 server package
  community.general.pkgng:
    name: postgresql18-server
    state: present

- name: Install Python psycopg database driver
  community.general.pkgng:
    name: py312-psycopg
    state: present

- name: Enable PostgreSQL in rc.conf
  community.general.sysrc:
    name: postgresql_enable
    value: "YES"

- name: Initialize PostgreSQL database directory
  ansible.builtin.command: service postgresql initdb # noqa command-instead-of-module
  args:
    creates: /var/db/postgres/data/PG_VERSION

- name: Ensure PostgreSQL service is running
  ansible.builtin.service:
    name: postgresql
    state: started

- name: Configure pg_hba.conf access rules
  community.postgresql.postgresql_pg_hba:
    dest: /var/db/postgres/data/pg_hba.conf
    contype: "{{ item.contype }}"
    users: "{{ item.users | default('all') }}"
    databases: "{{ item.databases | default('all') }}"
    address: "{{ item.address | default(omit) }}"
    method: "{{ item.method }}"
    comment: "{{ item.comment | default(omit) }}"
    state: present
  loop:
    # Unix domain socket connections
    - contype: local
      method: trust

    # IPv4 local connections
    - contype: host
      address: 127.0.0.1/32
      method: trust

    - contype: host
      address: 0.0.0.0/0
      method: md5

    # IPv6 local connections
    - contype: host
      address: ::1/128
      method: trust

    # Replication connections
    - contype: local
      databases: replication
      method: trust

    - contype: host
      databases: replication
      address: 127.0.0.1/32
      method: trust

    - contype: host
      databases: replication
      address: ::1/128
      method: trust

    # Custom rules for jails and local network
    - contype: host
      address: 10.2.2.2/32
      method: md5
      comment: Allow access from nextcloud and kanboard jails

    - contype: host
      address: 192.192.1.0/32
      method: md5
      comment: Allow access from local network
  notify: Reload postgresql

- name: Create Kanboard database user account
  community.postgresql.postgresql_user:
    name: "{{ kanboard_db_user }}"
    password: "{{ kanboard_db_pass }}"
    role_attr_flags: "LOGIN"
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create Kanboard application database
  community.postgresql.postgresql_db:
    name: "{{ kanboard_db_name }}"
    owner: "{{ kanboard_db_user }}"
    encoding: "UTF-8"
    state: present
  become: true
  become_user: postgres

- name: Grant all schema privileges on Kanboard database
  community.postgresql.postgresql_privs:
    db: "{{ kanboard_db_name }}"
    role: "{{ kanboard_db_user }}"
    objs: "ALL_IN_SCHEMA"
    privs: "ALL"
    state: present
  become: true
  become_user: postgres

- name: Create Nextcloud database user account
  community.postgresql.postgresql_user:
    name: "{{ nextcloud_db_user }}"
    password: "{{ nextcloud_db_pass }}"
    role_attr_flags: "LOGIN"
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create Nextcloud application database
  community.postgresql.postgresql_db:
    name: "{{ nextcloud_db_name }}"
    owner: "{{ nextcloud_db_user }}"
    encoding: "UTF-8"
    state: present
  become: true
  become_user: postgres

- name: Grant all schema privileges on Nextcloud database
  community.postgresql.postgresql_privs:
    db: "{{ nextcloud_db_name }}"
    role: "{{ nextcloud_db_user }}"
    objs: "ALL_IN_SCHEMA"
    privs: "ALL"
    state: present
  become: true
  become_user: postgres
